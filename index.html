
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kovil Savings</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff8ed;
  color: #402718;
}

header {
  background: linear-gradient(#0005, #0008),
              url("kovil-background.jpeg") center/cover;
  color: white;
  text-align: center;
  padding: 65px 15px;
  position: relative;
}

h1 {
  font-size: 28px;
  text-shadow: 2px 2px 5px black;
}

.admin {
  position: absolute;
  right: 15px;
  top: 15px;
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  background: #f3d17a;
  font-weight: bold;
}

.amount {
  background: white;
  margin: -25px 15px 25px;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  position: relative;
  box-shadow: 0 3px 12px #0002;
}

.amount h2 {
  color: #8a4b14;
  font-size: 30px;
}

.members {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 15px;
}

.member {
  background: white;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 2px 8px #0001;
}

.photo {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #ead8b8;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

@media (min-width: 700px) {
  .members {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
<button class="admin" onclick="alert('Admin PIN page next!')">
ADMIN
</button>

<h1>மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்</h1>
<p>Kovil Monthly Savings</p>
<p>Monthly Savings: ₹500 | Any Sunday</p>
</header>

<section class="amount">
  <b>மொத்த சேமிப்பு</b>
  <h2>₹ —</h2>
  <p>Total Savings</p>
</section>

<h2 style="text-align:center">உறுப்பினர்கள் / Members</h2>

<section class="members">

<div class="member">
<div class="photo">1</div>
<p>Member 1</p>
<small>ID: 1</small>
</div>

<div class="member">
<div class="photo">2</div>
<p>Member 2</p>
<small>ID: 2</small>
</div>

<div class="member">
<div class="photo">3</div>
<p>Member 3</p>
<small>ID: 3</small>
</div>

<div class="member">
<div class="photo">4</div>
<p>Member 4</p>
<small>ID: 4</small>
</div>

</section>

</body>
</html>
