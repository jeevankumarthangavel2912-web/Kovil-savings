
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>மாதா சேமிப்பு திட்டம்</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f0e5;
  color: #4b2600;
}

header {
  background: linear-gradient(#7b2600, #b85c00);
  color: white;
  text-align: center;
  padding: 25px 10px;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 8px 0;
}

.background {
  background-image:
    linear-gradient(#00000055, #00000055),
    url("Kovil-background.jpeg");

  background-size: cover;
  background-position: center;
  min-height: 300px;
  padding: 25px 15px;
  text-align: center;
}

.project-title {
  color: white;
  font-size: 28px;
  font-weight: bold;
  padding: 20px;
}

.members {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
}

.member-card {
  background: white;
  border: 2px solid #d5a253;
  border-radius: 12px;
  padding: 20px 10px;
  text-align: center;
  box-shadow: 0 3px 8px #0002;
}

.member-card h3 {
  margin: 5px;
  color: #8b3e00;
}

.admin {
  text-align: center;
  padding: 25px;
}

button {
  background: #7b2600;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 30px;
  font-size: 17px;
}
</style>
</head>

<body>

<header>
  <h1>மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்</h1>
  <p>வைகால் ரோடு, கோபிசெட்டிபாளையம்</p>
</header>

<section class="background">
  <div class="project-title">
    மாதா சேமிப்பு திட்டம்
  </div>
</section>

<section class="members">

  <div class="member-card">
    <h3>உறுப்பினர் எண்: 1</h3>
    <p>பெயர்: உறுப்பினர் பெயர்</p>
  </div>

  <div class="member-card">
    <h3>உறுப்பினர் எண்: 2</h3>
    <p>பெயர்: உறுப்பினர் பெயர்</p>
  </div>

</section>

<div class="admin">
  <button onclick="alert('Admin Login அடுத்த கட்டத்தில் உருவாக்கப்படும்')">
    ADMIN
  </button>
</div>

</body>
</html>
