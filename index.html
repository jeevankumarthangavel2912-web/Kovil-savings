<!DOCTYPE html>
<html lang="ta">
<head>

  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்</title>

<style>
/* PHOTO CROP MODAL */
.crop-modal {
  display: none;
  position: fixed;
  z-index: 2000;
  inset: 0;
  background: rgba(0,0,0,.75);
  padding: 15px;
  overflow: auto;
}

.crop-modal-content {
  background: white;
  max-width: 500px;
  margin: 30px auto;
  padding: 20px;
  border-radius: 18px;
  text-align: center;
}

.crop-image-container {
  width: 100%;
  max-height: 350px;
  overflow: hidden;
}

.crop-image-container img {
  max-width: 100%;
  display: block;
}

.crop-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 15px;
  flex-wrap: wrap;
}

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap');

:root {
  --wine: #174b78;
  --wine2: #258cc8;
  --gold: #76d7f4;
  --cream: #f1fbff;
  --ink: #102b43;
  --muted: #64849b;
  --line: #d9edf8;
  --shadow: 0 14px 38px rgba(15,91,143,.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Manrope','Noto Sans Tamil',sans-serif;
  background: radial-gradient(circle at top left,#e5f8ff 0,#f6fcff 42%,#eaf5ff 100%);
  color: var(--ink);
  min-height: 100vh;
}

header {
  position: relative;
  overflow: hidden;
  background: linear-gradient(125deg,#0b3157 0%,#126ca4 48%,#55c7e8 100%);
  color: #fff;
  text-align: center;
  padding: 38px 18px 34px;
  box-shadow: 0 10px 30px #0b315725;
}

header:before,
header:after {
  content: "";
  position: absolute;
  border: 1px solid #ffffff30;
  border-radius: 50%;
  width: 260px;
  height: 260px;
  top: -145px;
}

header:before { left: -70px; }
header:after { right: -70px; }

header h1 {
  position: relative;
  margin: 0 0 10px;
  font-size: clamp(23px,4vw,36px);
  font-weight: 800;
  letter-spacing: .2px;
  text-shadow: 0 2px 10px #0002;
}

header p {
  position: relative;
  margin: 5px 0;
  color: #e1f7ff;
  font-size: 14px;
}

.container {
  max-width: 1250px;
  margin: 0 auto;
  padding: 28px 22px 45px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 18px;
  margin-bottom: 25px;
}

.stat-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(145deg,#ffffff,#f2fbff);
  padding: 24px 20px;
  border: 1px solid #fff;
  border-radius: 20px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform .25s,box-shadow .25s;
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 42px #155b8b18;
}

.stat-card:after {
  content: "";
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  right: -28px;
  top: -35px;
  background: #a9e7ff4a;
}

.stat-card h3 {
  position: relative;
  margin: 0 0 10px;
  color: var(--wine);
  font-size: 15px;
  font-weight: 700;
}

.stat-card p {
  position: relative;
  font-size: clamp(22px,3vw,30px);
  font-weight: 800;
  margin: 0;
  color: #14334b;
}

.search-box {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid #cce7f5;
  border-radius: 15px;
  font-size: 16px;
  margin: 0 0 22px;
  background: #fafdff;
  box-shadow: 0 5px 18px #155b8b08;
  outline: none;
}

.search-box:focus {
  border-color: #38a9df;
  box-shadow: 0 0 0 4px #48b9ed22;
}

.members {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 18px;
}

.member {
  position: relative;
  background: linear-gradient(160deg,#ffffff 0%,#f2fbff 100%);
  padding: 22px 16px 20px;
  border: 1px solid #dceff8;
  border-radius: 20px;
  box-shadow: 0 8px 24px #155b8b0c;
  text-align: center;
  cursor: pointer;
  transition: transform .25s,box-shadow .25s,border-color .25s;
  overflow: hidden;
}

.member:before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 4px;
  background: linear-gradient(90deg,#1686c4,#8be7ff,#1686c4);
  opacity: .8;
}

.member:hover {
  transform: translateY(-6px);
  box-shadow: 0 18px 35px #155b8b20;
  border-color: #8ddcf7;
}

.member-photo,
.member-photo-placeholder {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  display: block;
  margin: 0 auto 14px;
  border: 5px solid #fff;
  outline: 2px solid #5bc8ee;
  background: #dff6ff;
  box-shadow: 0 8px 20px #155b8b20;
}

.member-photo {
  object-fit: cover;
}

.member-photo-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

.member h3 {
  margin: 8px 0 0;
  font-size: 17px;
  font-weight: 800;
  color: var(--wine);
  overflow-wrap: anywhere;
}

.member p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
}

button {
  background: linear-gradient(135deg,var(--wine),var(--wine2));
  color: white;
  border: 0;
  border-radius: 11px;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  font-weight: 700;
  box-shadow: 0 5px 14px #126ca422;
  transition: transform .2s,filter .2s,box-shadow .2s;
}

button:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.admin-button {
  display: block;
  margin: 30px auto 0;
  padding: 14px 28px;
  border-radius: 13px;
}

.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  inset: 0;
  overflow: auto;
  background: rgba(5,30,52,.62);
  backdrop-filter: blur(7px);
  padding: 20px;
}

.modal-content {
  background: linear-gradient(145deg,#fafdff,#fff5e8);
  max-width: 760px;
  margin: 35px auto;
  padding: 28px;
  border: 1px solid #fff;
  border-radius: 24px;
  position: relative;
  box-shadow: 0 25px 80px #0003;
}

.close-btn {
  float: right;
  padding: 8px 13px;
  border-radius: 9px;
  background: #dceff8;
  color: #174b78;
  box-shadow: none;
}

.form-group {
  margin: 16px 0;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 700;
  color: #164c70;
  font-size: 14px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid #cce6f3;
  border-radius: 11px;
  font-size: 16px;
  background: #fff;
  outline: none;
  font-family: inherit;
}

.admin-list-item {
  background: #fafdff;
  border: 1px solid #d9edf8;
  padding: 20px;
  border-radius: 17px;
  margin: 16px 0;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border-radius: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  min-width: 550px;
}

th,td {
  border: 1px solid #d9edf8;
  padding: 12px;
  text-align: left;
  font-size: 14px;
}

th {
  background: linear-gradient(135deg,#dff5ff,#bceaff);
  color: #174b78;
  font-weight: 800;
}

.member-summary {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
  margin: 20px 0 24px;
}

.member-summary-card {
  padding: 17px 14px;
  border-radius: 16px;
  background: linear-gradient(135deg,#dff6ff,#f8fdff);
  border: 1px solid #bfe8f7;
  text-align: center;
}

.member-summary-card span {
  display: block;
  color: #4b7894;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

.member-summary-card strong {
  display: block;
  color: #145b88;
  font-size: 24px;
  font-weight: 800;
}

@media(max-width:950px) {
  .members {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
}

@media(max-width:650px) {
  .container { padding: 16px 12px 30px; }

  .members {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 11px;
  }

  .member { padding: 15px 10px; }

  .member-photo,
  .member-photo-placeholder {
    width: 112px;
    height: 112px;
  }

  header { padding: 28px 12px; }

  header h1 { font-size: 22px; }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat-card { padding: 17px 10px; }

  .modal { padding: 9px; }

  .modal-content {
    padding: 17px;
    margin: 12px auto;
  }
}

@media(max-width:380px) {
  .member-photo,
  .member-photo-placeholder {
    width: 92px;
    height: 92px;
  }

  .stats-grid { grid-template-columns: 1fr; }
}
  
/* Member details photo */
.member-detail-photo {
  width: 220px;
  height: 220px;
  object-fit: cover;
  border-radius: 18px;
  display: block;
  margin: 20px auto;
  cursor: zoom-in;
  box-shadow: 0 8px 25px #155b8b30;
}

/* Full-size photo viewer */
.photo-viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0,0,0,.90);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.photo-viewer img {
  max-width: 95%;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 12px;
}

.photo-viewer-close {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 22px;
}

</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
</head>

<body>

<header>
  <h1>மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்</h1>
  <p>உறுப்பினர் சேமிப்பு மற்றும் பண மேலாண்மை</p>
</header>

<div class="container">

  <div class="stats-grid">
    <div class="stat-card">
      <h3>மொத்த உறுப்பினர்கள்</h3>
      <p id="totalMembers">0</p>
    </div>

    <div class="stat-card">
      <h3>மொத்த சேமிப்பு</h3>
      <p id="totalAmount">₹0</p>
    </div>

    <div class="stat-card">
      <h3>நிலுவைத் தொகை</h3>
      <p id="pendingAmount">₹0</p>
    </div>
  </div>

  <input
    type="text"
    id="searchInput"
    class="search-box"
    placeholder="உறுப்பினர் பெயர் அல்லது எண் தேடவும்..."
    oninput="renderMembers()"
  >

  <div id="membersList" class="members"></div>

  <button class="admin-button" onclick="openAdminLogin()">
    நிர்வாகி உள்நுழைவு
  </button>

</div>

<!-- உறுப்பினர் விவரங்கள் -->
<div id="memberModal" class="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('memberModal')">✕</button>
    <div id="memberDetails"></div>
  </div>
</div>

<!-- நிர்வாகி உள்நுழைவு -->
<div id="adminLoginModal" class="modal">
  <div class="modal-content" style="max-width:400px">
    <button class="close-btn" onclick="closeModal('adminLoginModal')">✕</button>

    <h2>நிர்வாகி உள்நுழைவு</h2>

    <div class="form-group">
      <label>நிர்வாக PIN</label>
      <input type="password" id="adminPin" placeholder="PIN உள்ளிடவும்">
    </div>

    <p id="loginMessage"></p>

    <button onclick="adminLogin()">உள்நுழைய</button>
  </div>
</div>

<!-- நிர்வாகப் பகுதி -->
<div id="adminDashboard" class="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('adminDashboard')">✕</button>
    <h2>நிர்வாகப் பகுதி</h2>
    <div id="adminDashboardContent"></div>
  </div>
</div>

<!-- உறுப்பினர் சேர்க்கும் பகுதி -->
<div id="addMemberModal" class="modal">
  <div class="modal-content" style="max-width:500px">
    <button class="close-btn" onclick="closeModal('addMemberModal')">✕</button>

    <h2>புதிய உறுப்பினர் சேர்க்க</h2>

    <div class="form-group">
      <label>உறுப்பினர் எண்</label>
      <input id="newMemberId" type="text">
    </div>

    <div class="form-group">
      <label>பெயர்</label>
      <input id="newMemberName" type="text">
    </div>

    <div class="form-group">
      <label>தொலைபேசி எண்</label>
      <input id="newMemberPhone" type="text">
    </div>

    <div class="form-group">
      <label>புகைப்படம்</label>
      <input type="file" id="newMemberPhoto" accept="image/*"
        onchange="handlePhotoSelected(this,'newMemberPhotoPreview','newMemberCropButton')">

      <img id="newMemberPhotoPreview"
        style="display:none;width:120px;height:120px;object-fit:cover;border-radius:50%;margin-top:10px">

      <button id="newMemberCropButton" style="display:none"
        onclick="openPhotoCrop('newMemberPhoto')">
        புகைப்படத்தை வெட்ட
      </button>
    </div>

    <p id="addMemberMessage"></p>
    <button onclick="addMember()">உறுப்பினரைச் சேர்க்க</button>
  </div>
</div>

<!-- உறுப்பினர் திருத்தம் -->
<div id="editMemberModal" class="modal">
  <div class="modal-content" style="max-width:500px">
    <button class="close-btn" onclick="closeModal('editMemberModal')">✕</button>

    <h2>உறுப்பினர் விவரங்களைத் திருத்த</h2>

    <div class="form-group">
      <label>உறுப்பினர் எண்</label>
      <input id="editMemberId" type="text" readonly>
    </div>

    <div class="form-group">
      <label>பெயர்</label>
      <input id="editMemberName" type="text">
    </div>

    <div class="form-group">
      <label>தொலைபேசி எண்</label>
      <input id="editMemberPhone" type="text">
    </div>

    <div id="editMemberCurrentPhoto"></div>

    <div class="form-group">
      <label>புதிய புகைப்படம்</label>
      <input type="file" id="editMemberPhoto" accept="image/*"
        onchange="handlePhotoSelected(this,'editMemberPhotoPreview','editMemberCropButton')">

      <img id="editMemberPhotoPreview"
        style="display:none;width:120px;height:120px;object-fit:cover;border-radius:50%;margin-top:10px">

      <button id="editMemberCropButton" style="display:none"
        onclick="openPhotoCrop('editMemberPhoto')">
        புகைப்படத்தை வெட்ட
      </button>
    </div>

    <p id="editMemberMessage"></p>
    <button onclick="updateMember()">விவரங்களைப் புதுப்பிக்க</button>
  </div>
</div>
<!-- பணம் செலுத்தும் பகுதி -->
<div id="paymentModal" class="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('paymentModal')">✕</button>

    <h2>மாத சேமிப்பு / பணம் செலுத்துதல்</h2>

    <div class="form-group">
      <label>உறுப்பினரைத் தேர்வு செய்யவும்</label>
      <select id="payMemberId">
        <option value="">உறுப்பினரைத் தேர்வு செய்யவும்</option>
      </select>
    </div>

    <div class="form-group">
      <label>மாதம்</label>
      <select id="payMonth">
        <option value="January">ஜனவரி</option>
        <option value="February">பிப்ரவரி</option>
        <option value="March">மார்ச்</option>
        <option value="April">ஏப்ரல்</option>
        <option value="May">மே</option>
        <option value="June">ஜூன்</option>
        <option value="July">ஜூலை</option>
        <option value="August">ஆகஸ்ட்</option>
        <option value="September">செப்டம்பர்</option>
        <option value="October">அக்டோபர்</option>
        <option value="November">நவம்பர்</option>
        <option value="December">டிசம்பர்</option>
      </select>
    </div>

    <div class="form-group">
      <label>வருடம்</label>
      <input type="number" id="payYear" value="2026">
    </div>

    <div class="form-group">
      <label>தொகை (₹)</label>
      <input type="number" id="payAmount" value="500">
    </div>

    <div class="form-group">
      <label>செலுத்திய தேதி</label>
      <input type="date" id="payDate">
    </div>

    <div class="form-group">
      <label>நிலை</label>
      <select id="payStatus">
        <option value="PAID">செலுத்தப்பட்டது</option>
        <option value="PENDING">நிலுவை</option>
      </select>
    </div>

    <p id="paymentMessage"></p>

    <button onclick="submitPayment()">பணம் சேமிக்க</button>

    <hr style="margin:25px 0;border:0;border-top:1px solid #d9edf8">

    <h3>மாத வாரியான பண வரலாறு</h3>

    <input
      id="paymentSearch"
      class="search-box"
      placeholder="உறுப்பினர் எண் தேடவும்"
      oninput="renderPaymentHistory()"
    >

    <div id="paymentHistory"></div>
  </div>
</div>
<div id="photoViewer" class="photo-viewer"
     onclick="closePhotoViewer()">

  <button class="photo-viewer-close"
          onclick="closePhotoViewer()">✕</button>

  <img id="largeMemberPhoto" src=""
       onclick="event.stopPropagation()">

</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyzCU0XMNuB2w6gt3V0Du6Xxr9Su8Hztb-MUN-DA0MhF7cTvQaAe_LajvHXXJGe3DY/exec";

const MONTHLY_AMOUNT = 500;
const START_YEAR = 2026;
const START_MONTH = 5; // June: JavaScript month index starts at 0

let isAdmin = false;
let adminPinValue = "";
let members = [];
let payments = [];

const months = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const tamilMonths = {
  January: "ஜனவரி",
  February: "பிப்ரவரி",
  March: "மார்ச்",
  April: "ஏப்ரல்",
  May: "மே",
  June: "ஜூன்",
  July: "ஜூலை",
  August: "ஆகஸ்ட்",
  September: "செப்டம்பர்",
  October: "அக்டோபர்",
  November: "நவம்பர்",
  December: "டிசம்பர்"
};

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

function getMemberId(m) {
  return String(m["Member ID"] ?? m.memberId ?? m.id ?? "");
}

function getMemberName(m) {
  return String(m["Name"] ?? m.name ?? "");
}

function getMemberPhone(m) {
  return String(m["Phone"] ?? m.phone ?? "");
}

function getMemberPhoto(m) {
  return String(m["Photo"] ?? m.photo ?? "");
}

function getPaymentMemberId(p) {
  return String(p["Member ID"] ?? p.memberId ?? "");
}

function getPaymentMonth(p) {
  return String(p["Month"] ?? p.month ?? "");
}

function getPaymentYear(p) {
  return Number(p["Year"] ?? p.year ?? 0);
}

function getPaymentAmount(p) {
  return Number(p["Amount"] ?? p.amount ?? 0);
}

function getPaymentDate(p) {
  return String(p["Paid Date"] ?? p.paidDate ?? p.date ?? "");
}

function getPaymentStatus(p) {
  return String(p["Status"] ?? p.status ?? "PENDING").toUpperCase();
}

function formatMoney(amount) {
  return "₹" + Number(amount || 0).toLocaleString("en-IN");
}

function monthTamil(month) {
  return tamilMonths[month] || month;
}

function closeModal(id) {
  const modal = document.getElementById(id);
  if (modal) modal.style.display = "none";
}
 
function getDrivePhotoURL(photo) {
  if (!photo) return "";

  photo = String(photo).trim();

  if (photo.startsWith("data:image/")) {
    return photo;
  }

  // Google Drive URL-ல் இருந்து File ID எடுக்கவும்
  const match = photo.match(/[-\w]{25,}/);

  if (match) {
    return "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(match[0]) + "&sz=w1000";
  }

  // சாதாரண image URL
  if (photo.startsWith("http")) {
    return photo;
  }

  return "";
}

// ================================
// MONTH HELPERS
// ================================

function getCurrentYear() {
  return new Date().getFullYear();
}

function getCurrentMonthIndex() {
  return new Date().getMonth();
}

function getTrackedMonths() {
  const result = [];
  const now = new Date();

  const start = new Date(START_YEAR, START_MONTH, 1);
  const end = new Date(now.getFullYear(), now.getMonth(), 1);

  let cursor = new Date(start);

  while (cursor <= end) {
    result.push({
      month: months[cursor.getMonth()],
      year: cursor.getFullYear(),
      monthIndex: cursor.getMonth()
    });

    cursor.setMonth(cursor.getMonth() + 1);
  }

  return result;
}

function isPaidForMonth(memberId, month, year) {
  return payments.some(p =>
    getPaymentMemberId(p) === String(memberId) &&
    getPaymentMonth(p) === String(month) &&
    getPaymentYear(p) === Number(year) &&
    getPaymentStatus(p) === "PAID"
  );
}

function getMemberPaidTotal(memberId) {
  return payments
    .filter(p =>
      getPaymentMemberId(p) === String(memberId) &&
      getPaymentStatus(p) === "PAID"
    )
    .reduce((total, p) => total + getPaymentAmount(p), 0);
}

function getMemberPendingMonths(memberId) {
  return getTrackedMonths().filter(item =>
    !isPaidForMonth(memberId, item.month, item.year)
  );
}

function getMemberPendingAmount(memberId) {
  return getMemberPendingMonths(memberId).length * MONTHLY_AMOUNT;
}


// ================================
// DASHBOARD STATS
// ================================

function updateStats() {
  const totalMembers = members.length;

  const totalPaid = payments
    .filter(p => getPaymentStatus(p) === "PAID")
    .reduce((total, p) => total + getPaymentAmount(p), 0);

  const trackedMonths = getTrackedMonths();

  let pendingAmount = 0;

  members.forEach(member => {
    const memberId = getMemberId(member);

    trackedMonths.forEach(item => {
      if (!isPaidForMonth(memberId, item.month, item.year)) {
        pendingAmount += MONTHLY_AMOUNT;
      }
    });
  });

  document.getElementById("totalMembers").textContent =
    totalMembers.toLocaleString("en-IN");

  document.getElementById("totalAmount").textContent =
    formatMoney(totalPaid);

  document.getElementById("pendingAmount").textContent =
    formatMoney(pendingAmount);
}

              <td>${getPaymentYear(p)}</td>
              <td>${formatMoney(getPaymentAmount(p))}</td>
              <td>${escapeHTML(getPaymentDate(p))}</td>
              <td>
                ${getPaymentStatus(p) === "PAID"
                  ? "செலுத்தப்பட்டது"
                  : "நிலுவை"}
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

async function readPhotoFile(input) {
  if (croppedPhotos[input.id]) {
    return croppedPhotos[input.id];
  }

  if (!input.files || !input.files[0]) {
    return "";
  }

  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;

    reader.readAsDataURL(input.files[0]);
  });
}


// ================================
// PHOTO CROP
// ================================

let croppedPhotos = {
  newMemberPhoto: "",
  editMemberPhoto: ""
};

let cropper = null;
let currentCropInputId = "";
let currentCropPreviewId = "";

function handlePhotoSelected(input, previewId, cropButtonId) {
  if (!input.files || !input.files[0]) return;

  const file = input.files[0];

  if (!file.type.startsWith("image/")) {
    alert("புகைப்பட கோப்பை மட்டும் தேர்வு செய்யவும்");
    input.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    const preview = document.getElementById(previewId);

    if (preview) {
      preview.src = event.target.result;
      preview.style.display = "block";
    }

    const cropButton = document.getElementById(cropButtonId);

    if (cropButton) {
      cropButton.style.display = "inline-block";
    }

    croppedPhotos[input.id] = "";
  };

  reader.readAsDataURL(file);
}

function openPhotoCrop(inputId) {
  const input = document.getElementById(inputId);

  if (!input || !input.files || !input.files[0]) {
    alert("முதலில் புகைப்படத்தைத் தேர்வு செய்யவும்");
    return;
  }

  currentCropInputId = inputId;

  currentCropPreviewId = inputId === "newMemberPhoto"
    ? "newMemberPhotoPreview"
    : "editMemberPhotoPreview";

  const reader = new FileReader();

  reader.onload = function(event) {
    const image = document.getElementById("cropImage");

    image.onload = function() {
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }

      cropper = new Cropper(image, {
        aspectRatio: 1,
        viewMode: 1,
        dragMode: "move",
        autoCropArea: 0.8,
        responsive: true,
        background: false
      });
    };

    image.src = event.target.result;

    document.getElementById("photoCropModal").style.display = "block";
  };

  reader.readAsDataURL(input.files[0]);
}

function saveCroppedPhoto() {
  if (!cropper) {
    alert("புகைப்படத்தை Crop செய்ய முடியவில்லை");
    return;
  }

  const canvas = cropper.getCroppedCanvas({
    width: 500,
    height: 500
  });

  if (!canvas) {
    alert("Crop செய்ய முடியவில்லை");
    return;
  }

  const croppedData = canvas.toDataURL("image/jpeg", 0.85);

  croppedPhotos[currentCropInputId] = croppedData;

  const preview = document.getElementById(currentCropPreviewId);

  if (preview) {
    preview.src = croppedData;
    preview.style.display = "block";
  }

  closePhotoCrop();

  alert("புகைப்படம் Crop செய்யப்பட்டது");
}

function closePhotoCrop() {
  document.getElementById("photoCropModal").style.display = "none";

  if (cropper) {
    cropper.destroy();
    cropper = null;
  }
}

async function postAction(data) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(data)
  });

  return await response.json();
}
