<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
      background:
        linear-gradient(rgba(0,0,0,0.58), rgba(0,0,0,0.70)),
        url("kovil-background.jpeg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .admin-button {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 10px 20px;
      background: #ffcc00;
      color: #222;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .header {
      padding: 75px 15px 20px;
    }

    .temple-name {
      font-size: 30px;
      color: #ffdf70;
      font-weight: bold;
      line-height: 1.6;
    }

    .address {
      font-size: 18px;
      margin-top: 8px;
    }

    .project-title {
      margin-top: 30px;
      font-size: 27px;
      color: #fff2a8;
      font-weight: bold;
    }

    .total-box {
      margin: 20px auto;
      padding: 20px;
      max-width: 450px;
      width: 90%;
      background: rgba(255,255,255,0.15);
      border: 2px solid #ffdf70;
      border-radius: 15px;
    }

    .total-label {
      font-size: 22px;
      font-weight: bold;
    }

    .total-amount {
      margin-top: 12px;
      font-size: 36px;
      color: #ffdf70;
      font-weight: bold;
    }

    .members-title {
      margin-top: 35px;
      font-size: 25px;
      color: #ffdf70;
    }

    .members {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 200px));
      justify-content: center;
      gap: 20px;
      padding: 25px 15px;
    }

    .member-card {
      background: rgba(255,255,255,0.16);
      border: 1px solid #ffdf70;
      border-radius: 12px;
      padding: 20px 10px;
    }

    .member-photo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      border: 3px solid #ffdf70;
    }

    .member-id {
      margin-top: 12px;
      font-size: 16px;
    }

    .member-name {
      margin-top: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .temple-name {
        font-size: 23px;
      }

      .address {
        font-size: 15px;
      }

      .project-title {
        font-size: 23px;
      }

      .total-label {
        font-size: 19px;
      }

      .total-amount {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <button class="admin-button" onclick="adminLogin()">ADMIN</button>

  <div class="header">

    <div class="temple-name">
      மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்
    </div>

    <div class="address">
      வைகால் ரோடு, கோபிசெட்டிபாளையம்
    </div>

    <div class="project-title">
      மாத சேமிப்பு திட்டம்
    </div>

    <div class="total-box">
      <div class="total-label">
        மொத்தம் வசூலான தொகை
      </div>

      <div class="total-amount" id="totalAmount">
        ₹0
      </div>
    </div>

  </div>

  <div class="members-title">
    உறுப்பினர்கள்
  </div>

  <div class="members">

    <div class="member-card">
      <img class="member-photo" src="" alt="உறுப்பினர் புகைப்படம்">

      <div class="member-id">
        உறுப்பினர் எண்: 1
      </div>

      <div class="member-name">
        உறுப்பினர் பெயர்
      </div>
    </div>

    <div class="member-card">
      <img class="member-photo" src="" alt="உறுப்பினர் புகைப்படம்">

      <div class="member-id">
        உறுப்பினர் எண்: 2
      </div>

      <div class="member-name">
        உறுப்பினர் பெயர்
      </div>
    </div>

  </div>

  <script>
    // Google Apps Script API URL
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzQ8mZOPaUVbGrq6pz8lfuTiSI91FJhGUr9R2SuPkxDsmen7QZDdGhmGqv_qseJ8l8/exec";

    async function loadTotalCollection() {
      const totalElement = document.getElementById("totalAmount");

      totalElement.textContent = "₹0";

      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        const total = Number(data.total) || 0;

        totalElement.textContent =
          "₹" + total.toLocaleString("en-IN");

      } catch (error) {
        console.error("Collection amount loading failed:", error);
        totalElement.textContent = "₹0";
      }
    }

    function adminLogin() {
      alert("Admin Login அடுத்த கட்டத்தில் உருவாக்கப்படும்");
    }

    loadTotalCollection();
  </script>

</body>
</html>
