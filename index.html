<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Tamil",sans-serif;
  background:#fff8e8;
  color:#321c0e
}

header{
  background:linear-gradient(135deg,#76230c,#b65b16);
  color:white;
  text-align:center;
  padding:25px 15px
}

header h1{margin:0 0 8px;font-size:27px}
header p{margin:0}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px
}

.stat-card{
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 10px #0001
}

.stat-card h3{margin:0 0 10px;color:#76230c}
.stat-card p{font-size:22px;font-weight:bold;margin:0}

.search-box{
  width:100%;
  padding:13px;
  border:1px solid #d8b98b;
  border-radius:8px;
  font-size:16px;
  margin-bottom:20px
}

.members{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px
}

.member{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 10px #0002;
  text-align:center;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s
}

.member:hover{
  transform:translateY(-4px);
  box-shadow:0 6px 18px #0003
}

.member-photo{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  margin:0 auto 12px;
  border:4px solid #d9a441;
  background:#fff0d5
}

.member-photo-placeholder{
  width:150px;
  height:150px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 12px;
  background:#fff0d5;
  font-size:48px;
  border:4px solid #d9a441
}

.member h3{
  margin:8px 0 0;
  font-size:18px;
  color:#76230c;
  overflow-wrap:anywhere
}

.member p{margin:7px 0 0;color:#76543b}

button{
  background:#8b2f0d;
  color:white;
  border:0;
  border-radius:7px;
  padding:11px 16px;
  cursor:pointer;
  font-size:14px
}

button:hover{background:#b65b16}

.admin-button{
  display:block;
  margin:25px auto;
  padding:13px 25px
}

.modal{
  display:none;
  position:fixed;
  z-index:1000;
  inset:0;
  overflow:auto;
  background:#0009;
  padding:20px
}

.modal-content{
  background:#fffaf0;
  max-width:650px;
  margin:35px auto;
  padding:25px;
  border-radius:12px;
  position:relative
}

.close-btn{
  float:right;
  padding:7px 12px
}

.form-group{margin:15px 0}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-weight:bold
}

.form-group input,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #d8b98b;
  border-radius:7px;
  font-size:16px;
  background:white
}

.admin-list-item{
  background:white;
  border:1px solid #ead7b9;
  padding:18px;
  border-radius:10px;
  margin:15px 0
}

.table-wrap{
  width:100%;
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  min-width:550px
}

th,td{
  border:1px solid #ead7b9;
  padding:10px;
  text-align:left
}

th{
  background:#f4e2c4;
  color:#76230c
}

#paymentMessage,
#addMemberMessage,
#editMemberMessage{
  color:#24733a;
  font-weight:bold
}

@media(max-width:800px){
  .members{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media(max-width:600px){
  .container{padding:12px}
  .members{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px
  }
  .member{padding:12px}
  .member-photo,
  .member-photo-placeholder{
    width:120px;
    height:120px
  }
  .member h3{font-size:15px}
  header h1{font-size:21px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .modal-content{padding:15px;margin:15px auto}
}
</style>
</head>

<body>

<header>
  <h1>மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்</h1>
  <p>வாய்க்கால் ரோடு, கோபிசெட்டிபாளையம்</p>
  <p>கோவில் சேமிப்பு கணக்கு</p>
</header>

<div class="container">

  <div class="stats-grid">
    <div class="stat-card">
      <h3>மொத்த உறுப்பினர்கள்</h3>
      <p id="totalMembers">0</p>
    </div>

    <div class="stat-card">
      <h3>மொத்த சேமிப்பு</h3>
      <p id="totalSavings">₹0</p>
    </div>

    <div class="stat-card">
      <h3>மாத சேமிப்பு</h3>
      <p>₹500</p>
    </div>
  </div>

  <input
    class="search-box"
    id="searchInput"
    placeholder="உறுப்பினர் பெயர் அல்லது ID தேடவும்..."
    oninput="renderMembers()"
  >

  <div class="members" id="membersList"></div>

  <button class="admin-button" onclick="openAdminLogin()">
    Admin Login
  </button>

</div>

<!-- MEMBER DETAILS MODAL -->

<div class="modal" id="memberModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('memberModal')">✕</button>
    <div id="memberDetails"></div>
  </div>
</div>

<!-- ADMIN LOGIN MODAL -->

<div class="modal" id="adminLoginModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('adminLoginModal')">✕</button>

    <h2>Admin Login</h2>

    <div class="form-group">
      <label>Admin PIN</label>
      <input type="password" id="adminPin" placeholder="PIN உள்ளிடவும்">
    </div>

    <button onclick="adminLogin()">Login</button>
    <p id="loginMessage"></p>
  </div>
</div>

<!-- ADMIN DASHBOARD MODAL -->

<div class="modal" id="adminDashboard">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('adminDashboard')">✕</button>

    <h2>Admin Dashboard</h2>

    <div id="adminDashboardContent"></div>
  </div>
</div>

<!-- ADD MEMBER MODAL -->

<div class="modal" id="addMemberModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('addMemberModal')">✕</button>

    <h2>புதிய உறுப்பினர் சேர்க்க</h2>

    <div class="form-group">
      <label>Member ID</label>
      <input id="newMemberId" placeholder="Member ID">
    </div>

    <div class="form-group">
      <label>உறுப்பினர் பெயர்</label>
      <input id="newMemberName" placeholder="பெயர்">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input id="newMemberPhone" placeholder="Phone number">
    </div>

    <div class="form-group">
      <label>புகைப்படம் (Phone / Gallery)</label>
      <input
        id="newMemberPhoto"
        type="file"
        accept="image/*"
        onchange="previewMemberPhoto(this,'newMemberPhotoPreview')"
      >
      <img
        id="newMemberPhotoPreview"
        class="member-photo"
        style="display:none;width:100px;height:100px;margin-top:10px"
      >
    </div>

    <button onclick="addMember()">உறுப்பினர் சேர்க்க</button>
    <p id="addMemberMessage"></p>
  </div>
</div>

<!-- EDIT MEMBER MODAL -->

<div class="modal" id="editMemberModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('editMemberModal')">✕</button>

    <h2>உறுப்பினர் விவரம் Edit</h2>

    <div class="form-group">
      <label>Member ID</label>
      <input id="editMemberId" readonly>
    </div>

    <div class="form-group">
      <label>பெயர்</label>
      <input id="editMemberName">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input id="editMemberPhone">
    </div>

    <div class="form-group">
      <label>தற்போதைய புகைப்படம்</label>
      <div id="editMemberCurrentPhoto"></div>
    </div>

    <div class="form-group">
      <label>புதிய புகைப்படம் (Phone / Gallery)</label>
      <input
        id="editMemberPhoto"
        type="file"
        accept="image/*"
        onchange="previewMemberPhoto(this,'editMemberPhotoPreview')"
      >
      <img
        id="editMemberPhotoPreview"
        class="member-photo"
        style="display:none;width:100px;height:100px;margin-top:10px"
      >
    </div>

    <button onclick="updateMember()">Update Member</button>
    <p id="editMemberMessage"></p>
  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyzCU0XMNuB2w6gt3V0Du6Xxr9Su8Hztb-MUN-DA0MhF7cTvQaAe_LajvHXXJGe3DY/exec";

const MONTHLY_AMOUNT = 500;
const START_YEAR = 2026;
const START_MONTH = 5;

const months = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const monthsTamil = [
  "ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்",
  "ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"
];

let members = [];
let payments = [];
let totalAmount = 0;
let isAdmin = false;

// ======================================
// COMMON HELPERS
// ======================================

function monthTamil(month){
  const index = months.indexOf(month);
  return index >= 0 ? monthsTamil[index] : month;
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

function formatMoney(amount){
  return "₹" + Number(amount || 0).toLocaleString("en-IN");
}

function getMemberId(member){
  return String(member["Member ID"] ?? member.memberId ?? member.id ?? "").trim();
}

function getMemberName(member){
  return String(member["Name"] ?? member.name ?? "").trim();
}

function getMemberPhoto(member){
  return String(member["Photo"] ?? member.photo ?? "").trim();
}

function getPaymentMemberId(payment){
  return String(payment["Member ID"] ?? payment.memberId ?? payment.id ?? "").trim();
}

function getPaymentMonth(payment){
  return String(payment["Month"] ?? payment.month ?? "").trim();
}

function getPaymentYear(payment){
  return Number(payment["Year"] ?? payment.year ?? 0);
}

function getPaymentAmount(payment){
  return Number(payment["Amount"] ?? payment.amount ?? 0);
}

function getPaymentStatus(payment){
  return String(payment["Status"] ?? payment.status ?? "PAID").trim().toUpperCase();
}

function getPaymentDate(payment){
  return String(payment["Paid Date"] ?? payment.paidDate ?? payment.date ?? "").trim();
}

// ======================================
// GOOGLE DRIVE PHOTO URL FIX
// ======================================

function getDrivePhotoURL(photoLink){
  if(!photoLink) return "";

  photoLink = String(photoLink).trim();

  // Google Drive URL formats:
  // drive.google.com/file/d/FILE_ID/view
  // drive.google.com/open?id=FILE_ID
  // drive.google.com/uc?id=FILE_ID
  // drive.google.com/uc?export=view&id=FILE_ID

  const match = photoLink.match(/(?:id=|\/d\/)([-\w]{20,})/);

  if(match && match[1]){
    return "https://drive.google.com/uc?export=view&id=" + match[1];
  }

  // Google Drive File ID நேரடியாக sheet-ல் இருந்தால்
  if(/^[\w-]{20,}$/.test(photoLink)){
    return "https://drive.google.com/uc?export=view&id=" + photoLink;
  }

  // Google Drive அல்லாத image URL
  return photoLink;
}

// ======================================
// LOAD DATA
// ======================================

async function loadData(){
  try{
    const response = await fetch(API_URL);
    const data = await response.json();

    members = data.members || [];
    payments = data.payments || [];
    totalAmount = Number(data.total || 0);

    document.getElementById("totalMembers").textContent = members.length;

    document.getElementById("totalSavings").textContent =
      formatMoney(payments.reduce((sum,p)=>sum + getPaymentAmount(p),0));

    renderMembers();

  }catch(error){
    console.error(error);

    document.getElementById("membersList").innerHTML =
      "<p>Data load செய்ய முடியவில்லை. Internet connection சரிபார்க்கவும்.</p>";
  }
}

// ======================================
// RENDER MEMBERS
// ======================================

function renderMembers(){
  const container = document.getElementById("membersList");

  const search = document.getElementById("searchInput").value
    .toLowerCase()
    .trim();

  const filtered = members.filter(member =>
    getMemberName(member).toLowerCase().includes(search) ||
    getMemberId(member).toLowerCase().includes(search)
  );

  if(filtered.length === 0){
    container.innerHTML = "<p>உறுப்பினர்கள் இல்லை.</p>";
    return;
  }

  container.innerHTML = filtered.map(member=>{
    const memberId = getMemberId(member);
    const name = getMemberName(member);

    const photo = getDrivePhotoURL(getMemberPhoto(member));

    const photoHTML = photo
      ? `<img
           class="member-photo"
           src="${escapeHTML(photo)}"
           alt="${escapeHTML(name)}"
           onerror="this.onerror=null;this.src='https://drive.google.com/thumbnail?id=${escapeHTML(getMemberPhoto(member).match(/(?:id=|\/d\/)([-\w]{20,})/)?.[1] || getMemberPhoto(member))}&sz=w500'"
         >`
      : `<div class="member-photo-placeholder">👤</div>`;

    return `
      <div class="member" onclick="showMemberDetails('${escapeHTML(memberId)}')">
        ${photoHTML}
        <h3>${escapeHTML(name)}</h3>
        <p>${escapeHTML(memberId)}</p>
      </div>
    `;
  }).join("");
}

// ======================================
// MEMBER DETAILS
// ======================================

function showMemberDetails(id){
  const member = members.find(item=>getMemberId(item) === String(id));

  if(!member) return;

  const memberId = getMemberId(member);

  const memberPayments = payments
    .filter(payment=>getPaymentMemberId(payment) === memberId)
    .slice()
    .reverse();

  const photo = getDrivePhotoURL(getMemberPhoto(member));

  let history = "";

  if(memberPayments.length === 0){
    history = "<p>Payment History இல்லை.</p>";
  }else{
    history = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>மாதம்</th>
              <th>வருடம்</th>
              <th>தொகை</th>
              <th>தேதி</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${memberPayments.map(payment=>`
              <tr>
                <td>${escapeHTML(monthTamil(getPaymentMonth(payment)))}</td>
                <td>${getPaymentYear(payment)}</td>
                <td>${formatMoney(getPaymentAmount(payment))}</td>
                <td>${escapeHTML(getPaymentDate(payment))}</td>
                <td>${escapeHTML(getPaymentStatus(payment))}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  document.getElementById("memberDetails").innerHTML = `
    <div style="text-align:center">
      ${
        photo
        ? `<img
             src="${escapeHTML(photo)}"
             class="member-photo"
             onerror="this.onerror=null;this.src='${escapeHTML(getMemberPhoto(member))}'"
           >`
        : `<div class="member-photo-placeholder">👤</div>`
      }

      <h2>${escapeHTML(getMemberName(member))}</h2>
      <p>Member ID: ${escapeHTML(memberId)}</p>
      <p>Phone: ${escapeHTML(member["Phone"] || member.phone || "")}</p>
    </div>

    <h3>Payment History</h3>
    ${history}
  `;

  document.getElementById("memberModal").style.display = "block";
}

// ======================================
// MODAL HELPERS
// ======================================

function closeModal(id){
  document.getElementById(id).style.display = "none";
}

function openAdminLogin(){
  document.getElementById("adminLoginModal").style.display = "block";
}

// ======================================
// ADMIN LOGIN
// ======================================

async function adminLogin(){
  const pin = document.getElementById("adminPin").value.trim();

  if(!pin){
    document.getElementById("loginMessage").textContent = "PIN உள்ளிடவும்";
    return;
  }

  try{
    const result = await postAction({
      action:"adminLogin",
      pin:pin
    });

    if(result.success){
      localStorage.setItem("templeAdminPin",pin);
      isAdmin = true;

      closeModal("adminLoginModal");

      document.getElementById("adminDashboard").style.display = "block";

      renderAdminDashboard();

    }else{
      document.getElementById("loginMessage").textContent =
        result.message || "Login தோல்வி";
    }

  }catch(error){
    document.getElementById("loginMessage").textContent = error.message;
  }
}

// ======================================
// ADMIN DASHBOARD
// ======================================

function renderAdminDashboard(){
  if(!isAdmin) return;

  document.getElementById("adminDashboardContent").innerHTML = `
    <div class="admin-list-item">
      <h3>உறுப்பினர் மேலாண்மை</h3>

      <button onclick="openAddMember()">புதிய உறுப்பினர் சேர்க்க</button>

      <button onclick="openMemberEditList()">உறுப்பினர் Edit</button>
    </div>

    <div class="admin-list-item">
      <h3>சேமிப்பு மேலாண்மை</h3>

      <button onclick="openPaymentModal()">Payment Update / History</button>
    </div>
  `;
}

function openAddMember(){
  if(!isAdmin) return;

  document.getElementById("addMemberModal").style.display = "block";
}

// ======================================
// PHOTO FILE HELPERS
// ======================================

function readPhotoFile(input){
  return new Promise((resolve,reject)=>{
    const file = input && input.files ? input.files[0] : null;

    if(!file){
      resolve("");
      return;
    }

    if(!file.type || !file.type.startsWith("image/")){
      reject(new Error("படக் கோப்பை மட்டும் தேர்வு செய்யவும்"));
      return;
    }

    if(file.size > 2 * 1024 * 1024){
      reject(new Error("புகைப்படம் 2MB-க்கு குறைவாக இருக்க வேண்டும்"));
      return;
    }

    const reader = new FileReader();

    reader.onload = ()=>resolve(String(reader.result || ""));
    reader.onerror = ()=>reject(new Error("புகைப்படத்தை படிக்க முடியவில்லை"));

    reader.readAsDataURL(file);
  });
}

function previewMemberPhoto(input,previewId){
  const preview = document.getElementById(previewId);
  const file = input.files && input.files[0];

  if(!preview) return;

  if(!file){
    preview.style.display = "none";
    preview.removeAttribute("src");
    return;
  }

  if(!file.type.startsWith("image/") || file.size > 2 * 1024 * 1024){
    alert("Image மட்டும் தேர்வு செய்யவும். அதிகபட்சம் 2MB.");
    input.value = "";
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}

// ======================================
// ADD MEMBER
// ======================================

async function addMember(){
  const memberId = document.getElementById("newMemberId").value.trim();
  const name = document.getElementById("newMemberName").value.trim();
  const phone = document.getElementById("newMemberPhone").value.trim();

  let photo = "";

  try{
    photo = await readPhotoFile(document.getElementById("newMemberPhoto"));
  }catch(error){
    document.getElementById("addMemberMessage").textContent = error.message;
    return;
  }

  if(!memberId || !name){
    document.getElementById("addMemberMessage").textContent =
      "Member ID மற்றும் பெயர் அவசியம்";
    return;
  }

  try{
    const result = await postAction({
      action:"addMember",
      pin:localStorage.getItem("templeAdminPin"),
      memberId:memberId,
      name:name,
      phone:phone,
      photo:photo
    });

    if(result.success){
      document.getElementById("addMemberMessage").textContent =
        "Member சேர்க்கப்பட்டது";

      document.getElementById("newMemberId").value = "";
      document.getElementById("newMemberName").value = "";
      document.getElementById("newMemberPhone").value = "";
      document.getElementById("newMemberPhoto").value = "";

      document.getElementById("newMemberPhotoPreview").style.display = "none";

      await loadData();

    }else{
      document.getElementById("addMemberMessage").textContent =
        result.message || "Member சேர்க்க முடியவில்லை";
    }

  }catch(error){
    document.getElementById("addMemberMessage").textContent = error.message;
  }
}

// ======================================
// PAYMENT MANAGEMENT
// ======================================

function openPaymentModal(){
  if(!isAdmin) return;

  document.getElementById("adminDashboard").style.display = "block";

  renderPaymentManagementPage();
}

function renderPaymentManagementPage(selectedMemberId = ""){
  if(!isAdmin) return;

  const memberOptions = members.map(member=>`
    <option
      value="${escapeHTML(getMemberId(member))}"
      ${getMemberId(member) === String(selectedMemberId) ? "selected" : ""}
    >
      ${escapeHTML(getMemberId(member))} - ${escapeHTML(getMemberName(member))}
    </option>
  `).join("");

  const monthOptions = months.map(month=>
    `<option value="${month}">${monthTamil(month)}</option>`
  ).join("");

  const now = new Date();

  const today = new Date(
    now.getTime() - now.getTimezoneOffset() * 60000
  ).toISOString().slice(0,10);

  document.getElementById("adminDashboardContent").innerHTML = `
    <section class="admin-list-item">
      <h3>💰 சேமிப்பு தொகை பதிவு / Payment Update</h3>

      <div class="form-group">
        <label>உறுப்பினர்</label>

        <select id="paymentMember" onchange="showAdminHistory()">
          ${memberOptions}
        </select>
      </div>

      <div class="form-group">
        <label>மாதம்</label>
        <select id="paymentMonth">${monthOptions}</select>
      </div>

      <div class="form-group">
        <label>வருடம்</label>
        <input type="number" id="paymentYear" value="${now.getFullYear()}">
      </div>

      <div class="form-group">
        <label>தொகை</label>
        <input type="number" id="paymentAmount" value="${MONTHLY_AMOUNT}">
      </div>

      <div class="form-group">
        <label>செலுத்திய தேதி</label>
        <input type="date" id="paymentDate" value="${today}">
      </div>

      <button onclick="savePayment()">Payment Save / Update</button>

      <p id="paymentMessage"></p>
    </section>

    <section class="admin-list-item">
      <h3>📋 தேர்வு செய்த உறுப்பினரின் Payment History</h3>

      <div id="adminHistory"></div>
    </section>
  `;

  showAdminHistory();
}

// ======================================
// SELECTED MEMBER PAYMENT HISTORY
// ======================================

function showAdminHistory(){
  if(!isAdmin) return;

  const memberSelect = document.getElementById("paymentMember");
  const historyBox = document.getElementById("adminHistory");

  if(!memberSelect || !historyBox) return;

  const memberId = memberSelect.value;

  const member = members.find(m=>
    getMemberId(m) === String(memberId)
  );

  const memberPayments = payments
    .filter(p=>getPaymentMemberId(p) === String(memberId))
    .slice()
    .reverse();

  let html = `
    <h3>${member ? escapeHTML(getMemberName(member)) : "உறுப்பினர்"} - History</h3>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Month</th>
            <th>Year</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
  `;

  if(memberPayments.length === 0){
    html += `
      <tr>
        <td colspan="6">இந்த உறுப்பினருக்கு Payment History இல்லை.</td>
      </tr>
    `;
  }else{
    memberPayments.forEach(payment=>{
      const month = getPaymentMonth(payment);
      const year = getPaymentYear(payment);

      html += `
        <tr>
          <td>${escapeHTML(monthTamil(month))}</td>
          <td>${year}</td>
          <td>${formatMoney(getPaymentAmount(payment))}</td>
          <td>${escapeHTML(getPaymentDate(payment))}</td>
          <td>${escapeHTML(getPaymentStatus(payment))}</td>
          <td>
            <button onclick="deletePayment('${escapeHTML(memberId)}','${escapeHTML(month)}','${year}')">
              Delete
            </button>
          </td>
        </tr>
      `;
    });
  }

  html += `
        </tbody>
      </table>
    </div>
  `;

  historyBox.innerHTML = html;
}

// ======================================
// SAVE PAYMENT
// ======================================

async function savePayment(){
  const memberId = document.getElementById("paymentMember").value;
  const month = document.getElementById("paymentMonth").value;
  const year = document.getElementById("paymentYear").value;
  const amount = document.getElementById("paymentAmount").value;
  const date = document.getElementById("paymentDate").value;

  if(!memberId || !month || !year || !amount){
    document.getElementById("paymentMessage").textContent =
      "அனைத்து விவரங்களையும் நிரப்பவும்";
    return;
  }

  try{
    const result = await postAction({
      action:"savePayment",
      pin:localStorage.getItem("templeAdminPin"),
      memberId:memberId,
      month:month,
      year:year,
      amount:amount,
      paidDate:date,
      status:"PAID"
    });

    if(result.success){
      await loadData();

      renderPaymentManagementPage(memberId);

      const message = document.getElementById("paymentMessage");

      if(message){
        message.textContent = "Payment சேமிக்கப்பட்டது";
      }

    }else{
      document.getElementById("paymentMessage").textContent =
        result.message || "Payment சேமிக்க முடியவில்லை";
    }

  }catch(error){
    document.getElementById("paymentMessage").textContent = error.message;
  }
}

// ======================================
// EDIT MEMBER LIST
// ======================================

function openMemberEditList(){
  if(!isAdmin) return;

  let html = "<h3>உறுப்பினர்கள்</h3>";

  members.forEach(member=>{
    html += `
      <div class="admin-list-item">
        <strong>${escapeHTML(getMemberId(member))}</strong>
        - ${escapeHTML(getMemberName(member))}

        <button onclick="editMember('${escapeHTML(getMemberId(member))}')">
          Edit
        </button>
      </div>
    `;
  });

  document.getElementById("adminDashboardContent").innerHTML = html;
}

// ======================================
// OPEN EDIT MEMBER
// ======================================

function editMember(id){
  const member = members.find(item=>
    getMemberId(item) === String(id)
  );

  if(!member) return;

  document.getElementById("editMemberId").value = getMemberId(member);
  document.getElementById("editMemberName").value = getMemberName(member);

  document.getElementById("editMemberPhone").value =
    member["Phone"] || member.phone || "";

  document.getElementById("editMemberPhoto").value = "";

  document.getElementById("editMemberPhotoPreview").style.display = "none";

  const currentPhoto = getDrivePhotoURL(getMemberPhoto(member));

  document.getElementById("editMemberCurrentPhoto").innerHTML =
    currentPhoto
    ? `<img
         src="${escapeHTML(currentPhoto)}"
         alt="Current photo"
         style="width:100px;height:100px;object-fit:cover;border-radius:50%"
         onerror="this.onerror=null;this.src='${escapeHTML(getMemberPhoto(member))}'"
       >`
    : "பழைய புகைப்படம் இல்லை";

  document.getElementById("editMemberModal").style.display = "block";
}

// ======================================
// UPDATE MEMBER
// ======================================

async function updateMember(){
  const memberId = document.getElementById("editMemberId").value;
  const name = document.getElementById("editMemberName").value.trim();
  const phone = document.getElementById("editMemberPhone").value.trim();

  let photo = "";

  try{
    photo = await readPhotoFile(document.getElementById("editMemberPhoto"));
  }catch(error){
    document.getElementById("editMemberMessage").textContent = error.message;
    return;
  }

  try{
    const result = await postAction({
      action:"editMember",
      pin:localStorage.getItem("templeAdminPin"),
      memberId:memberId,
      name:name,
      phone:phone,
      photo:photo
    });

    if(result.success){
      document.getElementById("editMemberMessage").textContent = "Updated";

      await loadData();

      closeModal("editMemberModal");

      openMemberEditList();

    }else{
      document.getElementById("editMemberMessage").textContent =
        result.message || "Update முடியவில்லை";
    }

  }catch(error){
    document.getElementById("editMemberMessage").textContent = error.message;
  }
}

// ======================================
// DELETE PAYMENT
// ======================================

async function deletePayment(memberId,month,year){
  if(!confirm("இந்த Payment-ஐ delete செய்ய வேண்டுமா?")) return;

  try{
    const result = await postAction({
      action:"deletePayment",
      pin:localStorage.getItem("templeAdminPin"),
      memberId:memberId,
      month:month,
      year:year
    });

    if(result.success){
      await loadData();

      renderPaymentManagementPage(memberId);

    }else{
      alert(result.message || "Delete முடியவில்லை");
    }

  }catch(error){
    alert(error.message);
  }
}

// ======================================
// API POST
// ======================================

async function postAction(payload){
  const response = await fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify(payload)
  });

  const text = await response.text();

  try{
    return JSON.parse(text);
  }catch(error){
    throw new Error(
      "Apps Script JSON பதில் கிடைக்கவில்லை. Deployment URL / access check செய்யவும்."
    );
  }
}

// ======================================
// CLOSE MODAL ON OUTSIDE CLICK
// ======================================

window.onclick = function(event){
  document.querySelectorAll(".modal").forEach(modal=>{
    if(event.target === modal){
      modal.style.display = "none";
    }
  });
};

// ======================================
// INITIAL LOAD
// ======================================

loadData();

</script>
