<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap');

:root {
  --wine: #174b78;
  --wine2: #258cc8;
  --gold: #76d7f4;
  --cream: #f1fbff;
  --ink: #102b43;
  --muted: #64849b;
  --line: #d9edf8;
  --shadow: 0 14px 38px rgba(15,91,143,.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Manrope','Noto Sans Tamil',sans-serif;
  background: radial-gradient(circle at top left,#e5f8ff 0,#f6fcff 42%,#eaf5ff 100%);
  color: var(--ink);
  min-height: 100vh;
}

header {
  position: relative;
  overflow: hidden;
  background: linear-gradient(125deg,#0b3157 0%,#126ca4 48%,#55c7e8 100%);
  color: #fff;
  text-align: center;
  padding: 38px 18px 34px;
  box-shadow: 0 10px 30px #0b315725;
}

header:before,
header:after {
  content: "";
  position: absolute;
  border: 1px solid #ffffff30;
  border-radius: 50%;
  width: 260px;
  height: 260px;
  top: -145px;
}

header:before {
  left: -70px;
}

header:after {
  right: -70px;
}

header h1 {
  position: relative;
  margin: 0 0 10px;
  font-size: clamp(23px,4vw,36px);
  font-weight: 800;
  letter-spacing: .2px;
  text-shadow: 0 2px 10px #0002;
}

header p {
  position: relative;
  margin: 5px 0;
  color: #e1f7ff;
  font-size: 14px;
}

.container {
  max-width: 1250px;
  margin: 0 auto;
  padding: 28px 22px 45px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 18px;
  margin-bottom: 25px;
}

.stat-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(145deg,#ffffff,#f2fbff);
  padding: 24px 20px;
  border: 1px solid #fff;
  border-radius: 20px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: transform .25s,box-shadow .25s;
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 42px #155b8b18;
}

.stat-card:after {
  content: "";
  position: absolute;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  right: -28px;
  top: -35px;
  background: #a9e7ff4a;
}

.stat-card h3 {
  position: relative;
  margin: 0 0 10px;
  color: var(--wine);
  font-size: 15px;
  font-weight: 700;
}

.stat-card p {
  position: relative;
  font-size: clamp(22px,3vw,30px);
  font-weight: 800;
  margin: 0;
  color: #14334b;
}

.search-box {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid #cce7f5;
  border-radius: 15px;
  font-size: 16px;
  margin: 0 0 22px;
  background: #fafdff;
  box-shadow: 0 5px 18px #155b8b08;
  outline: none;
  transition: border .2s,box-shadow .2s;
}

.search-box:focus {
  border-color: #38a9df;
  box-shadow: 0 0 0 4px #48b9ed22;
}

.members {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 18px;
}

.member {
  position: relative;
  background: linear-gradient(160deg,#ffffff 0%,#f2fbff 100%);
  padding: 22px 16px 20px;
  border: 1px solid #dceff8;
  border-radius: 20px;
  box-shadow: 0 8px 24px #155b8b0c;
  text-align: center;
  cursor: pointer;
  transition: transform .25s,box-shadow .25s,border-color .25s;
  overflow: hidden;
}

.member:before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 4px;
  background: linear-gradient(90deg,#1686c4,#8be7ff,#1686c4);
  opacity: .8;
}

.member:hover {
  transform: translateY(-6px);
  box-shadow: 0 18px 35px #155b8b20;
  border-color: #8ddcf7;
}

.member-photo {
  width: 145px;
  height: 145px;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  margin: 0 auto 14px;
  border: 5px solid #fff;
  outline: 2px solid #5bc8ee;
  background: #dff6ff;
  box-shadow: 0 8px 20px #155b8b20;
}

.member-photo-placeholder {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  background: linear-gradient(135deg,#dff6ff,#bcecff);
  font-size: 48px;
  border: 5px solid #fff;
  outline: 2px solid #5bc8ee;
}

.member h3 {
  margin: 8px 0 0;
  font-size: 17px;
  font-weight: 800;
  color: var(--wine);
  overflow-wrap: anywhere;
}

.member p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
}

button {
  background: linear-gradient(135deg,var(--wine),var(--wine2));
  color: white;
  border: 0;
  border-radius: 11px;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  font-weight: 700;
  box-shadow: 0 5px 14px #126ca422;
  transition: transform .2s,filter .2s,box-shadow .2s;
}

button:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
  box-shadow: 0 8px 18px #126ca430;
}

button:active {
  transform: translateY(0);
}

.admin-button {
  display: block;
  margin: 30px auto 0;
  padding: 14px 28px;
  border-radius: 13px;
}

.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  inset: 0;
  overflow: auto;
  background: rgba(5,30,52,.62);
  backdrop-filter: blur(7px);
  padding: 20px;
}

.modal-content {
  background: linear-gradient(145deg,#fafdff,#fff5e8);
  max-width: 760px;
  margin: 35px auto;
  padding: 28px;
  border: 1px solid #fff;
  border-radius: 24px;
  position: relative;
  box-shadow: 0 25px 80px #0003;
  animation: modalIn .25s ease-out;
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.close-btn {
  float: right;
  padding: 8px 13px;
  border-radius: 9px;
  background: #dceff8;
  color: #174b78;
  box-shadow: none;
}

.close-btn:hover {
  background: #bde8f7;
}

.form-group {
  margin: 16px 0;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 700;
  color: #164c70;
  font-size: 14px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid #cce6f3;
  border-radius: 11px;
  font-size: 16px;
  background: #fff;
  outline: none;
  font-family: inherit;
}

.form-group input:focus,
.form-group select:focus {
  border-color: #38a9df;
  box-shadow: 0 0 0 3px #d9a44120;
}

.admin-list-item {
  background: #fafdff;
  border: 1px solid #d9edf8;
  padding: 20px;
  border-radius: 17px;
  margin: 16px 0;
  box-shadow: 0 7px 20px #5b321a08;
}

.admin-list-item h3 {
  color: var(--wine);
  margin-top: 0;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border-radius: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  min-width: 550px;
  border-radius: 12px;
  overflow: hidden;
}

th,td {
  border: 1px solid #f0e1d1;
  padding: 12px;
  text-align: left;
  font-size: 14px;
}

th {
  background: linear-gradient(135deg,#dff5ff,#bceaff);
  color: #174b78;
  font-weight: 800;
}

tbody tr:nth-child(even) {
  background: #f5fcff;
}

tbody tr:hover {
  background: #e7f8ff;
}

#paymentMessage,
#addMemberMessage,
#editMemberMessage {
  color: #1678a8;
  font-weight: 700;
}

/* Member detail total summary */

.member-summary {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
  margin: 20px 0 24px;
}

.member-summary-card {
  padding: 17px 14px;
  border-radius: 16px;
  background: linear-gradient(135deg,#dff6ff,#f8fdff);
  border: 1px solid #bfe8f7;
  text-align: center;
}

.member-summary-card span {
  display: block;
  color: #4b7894;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

.member-summary-card strong {
  display: block;
  color: #145b88;
  font-size: 24px;
  font-weight: 800;
}

@media(max-width:950px) {
  .members {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
}

@media(max-width:650px) {
  .container {
    padding: 16px 12px 30px;
  }

  .members {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 11px;
  }

  .member {
    padding: 15px 10px;
    border-radius: 16px;
  }

  .member-photo,
  .member-photo-placeholder {
    width: 112px;
    height: 112px;
  }

  .member h3 {
    font-size: 14px;
  }

  .member p {
    font-size: 12px;
  }

  header {
    padding: 28px 12px;
  }

  header h1 {
    font-size: 22px;
  }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat-card {
    padding: 17px 10px;
    border-radius: 15px;
  }

  .stat-card h3 {
    font-size: 13px;
  }

  .stat-card p {
    font-size: 21px;
  }

  .modal {
    padding: 9px;
  }

  .modal-content {
    padding: 17px;
    margin: 12px auto;
    border-radius: 18px;
  }

  .member-summary-card strong {
    font-size: 20px;
  }
}

@media(max-width:380px) {
  .member-photo,
  .member-photo-placeholder {
    width: 92px;
    height: 92px;
  }

  .stats-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>மஹா முனி அண்ணமார் சுவாமி திருக்கோவில்</h1>
  <p>வாய்க்கால் ரோடு, கோபிசெட்டிபாளையம்</p>
  <p>கோவில் சேமிப்பு கணக்கு</p>
</header>

<div class="container">

  <div class="stats-grid">
    <div class="stat-card">
      <h3>மொத்த உறுப்பினர்கள்</h3>
      <p id="totalMembers">0</p>
    </div>

    <div class="stat-card">
      <h3>மொத்த சேமிப்பு</h3>
      <p id="totalSavings">₹0</p>
    </div>

    <div class="stat-card">
      <h3>மாத சேமிப்பு</h3>
      <p>₹500</p>
    </div>
  </div>

  <input
    class="search-box"
    id="searchInput"
    placeholder="உறுப்பினர் பெயர் அல்லது ID தேடவும்..."
    oninput="renderMembers()"
  >

  <div class="members" id="membersList"></div>

  <button class="admin-button" onclick="openAdminLogin()">
    Admin Login
  </button>

</div>

<!-- MEMBER DETAILS MODAL -->

<div class="modal" id="memberModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('memberModal')">✕</button>
    <div id="memberDetails"></div>
  </div>
</div>

<!-- ADMIN LOGIN MODAL -->

<div class="modal" id="adminLoginModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('adminLoginModal')">✕</button>

    <h2>Admin Login</h2>

    <div class="form-group">
      <label>Admin PIN</label>
      <input type="password" id="adminPin" placeholder="PIN உள்ளிடவும்">
    </div>

    <button onclick="adminLogin()">Login</button>
    <p id="loginMessage"></p>
  </div>
</div>

<!-- ADMIN DASHBOARD MODAL -->

<div class="modal" id="adminDashboard">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('adminDashboard')">✕</button>

    <h2>Admin Dashboard</h2>

    <div id="adminDashboardContent"></div>
  </div>
</div>

<!-- ADD MEMBER MODAL -->

<div class="modal" id="addMemberModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('addMemberModal')">✕</button>

    <h2>புதிய உறுப்பினர் சேர்க்க</h2>

    <div class="form-group">
      <label>Member ID</label>
      <input id="newMemberId" placeholder="Member ID">
    </div>

    <div class="form-group">
      <label>உறுப்பினர் பெயர்</label>
      <input id="newMemberName" placeholder="பெயர்">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input id="newMemberPhone" placeholder="Phone number">
    </div>

    <div class="form-group">
      <label>புகைப்படம் (Phone / Gallery)</label>
      <input
        id="newMemberPhoto"
        type="file"
        accept="image/*"
        onchange="previewMemberPhoto(this,'newMemberPhotoPreview')"
      >
      <img
        id="newMemberPhotoPreview"
        class="member-photo"
        style="display:none;width:100px;height:100px;margin-top:10px"
      >
    </div>

    <button onclick="addMember()">உறுப்பினர் சேர்க்க</button>
    <p id="addMemberMessage"></p>
  </div>
</div>

<!-- EDIT MEMBER MODAL -->

<div class="modal" id="editMemberModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('editMemberModal')">✕</button>

    <h2>உறுப்பினர் விவரம் Edit</h2>

    <div class="form-group">
      <label>Member ID</label>
      <input id="editMemberId" readonly>
    </div>

    <div class="form-group">
      <label>பெயர்</label>
      <input id="editMemberName">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input id="editMemberPhone">
    </div>

    <div class="form-group">
      <label>தற்போதைய புகைப்படம்</label>
      <div id="editMemberCurrentPhoto"></div>
    </div>

    <div class="form-group">
      <label>புதிய புகைப்படம் (Phone / Gallery)</label>
      <input
        id="editMemberPhoto"
        type="file"
        accept="image/*"
        onchange="previewMemberPhoto(this,'editMemberPhotoPreview')"
      >
      <img
        id="editMemberPhotoPreview"
        class="member-photo"
        style="display:none;width:100px;height:100px;margin-top:10px"
      >
    </div>

    <button onclick="updateMember()">Update Member</button>
    <p id="editMemberMessage"></p>
  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyzCU0XMNuB2w6gt3V0Du6Xxr9Su8Hztb-MUN-DA0MhF7cTvQaAe_LajvHXXJGe3DY/exec";

const MONTHLY_AMOUNT = 500;
const START_YEAR = 2026;
const START_MONTH = 5;

const months = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

const monthsTamil = [
  "ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்",
  "ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"
];

let members = [];
let payments = [];
let totalAmount = 0;
let isAdmin = false;

// ======================================
// COMMON HELPERS
// ======================================

function monthTamil(month){
  const index = months.indexOf(month);
  return index >= 0 ? monthsTamil[index] : month;
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

function formatMoney(amount){
  return "₹" + Number(amount || 0).toLocaleString("en-IN");
}

function getMemberId(member){
  return String(member["Member ID"] ?? member.memberId ?? member.id ?? "").trim();
}

function getMemberName(member){
  return String(member["Name"] ?? member.name ?? "").trim();
}

function getMemberPhoto(member){
  return String(member["Photo"] ?? member.photo ?? "").trim();
}

function getPaymentMemberId(payment){
  return String(payment["Member ID"] ?? payment.memberId ?? payment.id ?? "").trim();
}

function getPaymentMonth(payment){
  return String(payment["Month"] ?? payment.month ?? "").trim();
}

function getPaymentYear(payment){
  return Number(payment["Year"] ?? payment.year ?? 0);
}

function getPaymentAmount(payment){
  return Number(payment["Amount"] ?? payment.amount ?? 0);
}

function getPaymentStatus(payment){
  return String(payment["Status"] ?? payment.status ?? "PAID").trim().toUpperCase();
}

function getPaymentDate(payment){
  return String(payment["Paid Date"] ?? payment.paidDate ?? payment.date ?? "").trim();
}

// ======================================
// GOOGLE DRIVE PHOTO URL FIX
// ======================================

function getDrivePhotoURL(photoLink){
  if(!photoLink) return "";

  photoLink = String(photoLink).trim();

  const match = photoLink.match(/(?:id=|\/d\/)([-\w]{20,})/);

  if(match && match[1]){
    return "https://drive.google.com/uc?export=view&id=" + match[1];
  }

  if(/^[\w-]{20,}$/.test(photoLink)){
    return "https://drive.google.com/uc?export=view&id=" + photoLink;
  }

  return photoLink;
}

// ======================================
// LOAD DATA
// ======================================

async function loadData(){
  try{
    const response = await fetch(API_URL);
    const data = await response.json();

    members = data.members || [];
    payments = data.payments || [];
    totalAmount = Number(data.total || 0);

    document.getElementById("totalMembers").textContent = members.length;

    document.getElementById("totalSavings").textContent =
      formatMoney(payments.reduce((sum,p)=>sum + getPaymentAmount(p),0));

    renderMembers();

  }catch(error){
    console.error(error);

    document.getElementById("membersList").innerHTML =
      "<p>Data load செய்ய முடியவில்லை. Internet connection சரிபார்க்கவும்.</p>";
  }
}

// ======================================
// RENDER MEMBERS
// ======================================

function renderMembers(){
  const container = document.getElementById("membersList");

  const search = document.getElementById("searchInput").value
    .toLowerCase()
    .trim();

  const filtered = members.filter(member =>
    getMemberName(member).toLowerCase().includes(search) ||
    getMemberId(member).toLowerCase().includes(search)
  );

  if(filtered.length === 0){
    container.innerHTML = "<p>உறுப்பினர்கள் இல்லை.</p>";
    return;
  }

  container.innerHTML = filtered.map(member=>{
    const memberId = getMemberId(member);
    const name = getMemberName(member);

    const photo = getDrivePhotoURL(getMemberPhoto(member));

    const photoHTML = photo
      ? `<img
           class="member-photo"
           src="${escapeHTML(photo)}"
           alt="${escapeHTML(name)}"
           onerror="this.onerror=null;this.src='https://drive.google.com/thumbnail?id=${escapeHTML(getMemberPhoto(member).match(/(?:id=|\/d\/)([-\w]{20,})/)?.[1] || getMemberPhoto(member))}&sz=w500'"
         >`
      : `<div class="member-photo-placeholder">👤</div>`;

    return `
      <div class="member" onclick="showMemberDetails('${escapeHTML(memberId)}')">
        ${photoHTML}
        <h3>${escapeHTML(name)}</h3>
        <p>${escapeHTML(memberId)}</p>
      </div>
    `;
  }).join("");
}

// ======================================
// MEMBER DETAILS
// ======================================

function showMemberDetails(id){
  const member = members.find(item=>getMemberId(item) === String(id));

  if(!member) return;

  const memberId = getMemberId(member);

  const memberPayments = payments
    .filter(payment=>getPaymentMemberId(payment) === memberId)
    .slice()
    .reverse();

  const memberTotalAmount = memberPayments.reduce((sum,payment)=>sum + getPaymentAmount(payment),0);
  const memberPaymentCount = memberPayments.length;

  const photo = getDrivePhotoURL(getMemberPhoto(member));

  let history = "";

  if(memberPayments.length === 0){
    history = "<p>Payment History இல்லை.</p>";
  }else{
    history = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>மாதம்</th>
              <th>வருடம்</th>
              <th>தொகை</th>
              <th>தேதி</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${memberPayments.map(payment=>`
              <tr>
                <td>${escapeHTML(monthTamil(getPaymentMonth(payment)))}</td>
                <td>${getPaymentYear(payment)}</td>
                <td>${formatMoney(getPaymentAmount(payment))}</td>
                <td>${escapeHTML(getPaymentDate(payment).split(" ")[0].split("T")[0])}</td>
                <td>${escapeHTML(getPaymentStatus(payment))}</td>
              </tr>

// ======================================
// PHOTO FILE HELPERS
// ======================================

function readPhotoFile(input){
  return new Promise((resolve,reject)=>{
    const file = input && input.files ? input.files[0] : null;

    if(!file){
      resolve("");
      return;
    }

    if(!file.type || !file.type.startsWith("image/")){
      reject(new Error("படக் கோப்பை மட்டும் தேர்வு செய்யவும்"));
      return;
    }

    if(file.size > 2 * 1024 * 1024){
      reject(new Error("புகைப்படம் 2MB-க்கு குறைவாக இருக்க வேண்டும்"));
      return;
    }

    const reader = new FileReader();

    reader.onload = ()=>resolve(String(reader.result || ""));
    reader.onerror = ()=>reject(new Error("புகைப்படத்தை படிக்க முடியவில்லை"));

    reader.readAsDataURL(file);
  });
}

function previewMemberPhoto(input,previewId){
  const preview = document.getElementById(previewId);
  const file = input.files && input.files[0];

  if(!preview) return;

  if(!file){
    preview.style.display = "none";
    preview.removeAttribute("src");
    return;
  }

  if(!file.type.startsWith("image/") || file.size > 2 * 1024 * 1024){
    alert("Image மட்டும் தேர்வு செய்யவும். அதிகபட்சம் 2MB.");
    input.value = "";
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}

  if(!isAdmin) return;

  const memberOptions = members.map(member=>`

      value="${escapeHTML(getMemberId(member))}"

      ${escapeHTML(getMemberId(member))} - ${escapeHTML(getMemberName(member))}
    </option>
  `).join("");

  const monthOptions = months.map(month=>
    `<option value="${month}">${monthTamil(month)}</option>`
  ).join("");

  const now = new Date();

  const today = new Date(
    now.getTime() - now.getTimezoneOffset() * 60000
  ).toISOString().slice(0,10);

  document.getElementById("adminDashboardContent").innerHTML = `
    <section class="admin-list-item">
      <h3>💰 சேமிப்பு தொகை பதிவு / Payment Update</h3>

      <div class="form-group">
        <label>உறுப்பினர்</label>

        <select id="paymentMember" onchange="showAdminHistory()">
          ${memberOptions}
        </select>
      </div>

      <div class="form-group">
        <label>மாதம்</label>
        <select id="paymentMonth">${monthOptions}</select>
      </div>

      <div class="form-group">
        <label>வருடம்</label>
        <input type="number" id="paymentYear" value="${now.getFullYear()}">
      </div>

      <div class="form-group">
        <label>தொகை</label>
        <input type="number" id="paymentAmount" value="${MONTHLY_AMOUNT}">
      </div>

      <div class="form-group">
        <label>செலுத்திய தேதி</label>
        <input type="date" id="paymentDate" value="${today}">
      </div>

      <button onclick="savePayment()">Payment Save / Update</button>

      <p id="paymentMessage"></p>
    </section>

    <section class="admin-list-item">
      <h3>📋 தேர்வு செய்த உறுப்பினரின் Payment History</h3>

      <div id="adminHistory"></div>
    </section>
  `;

  showAdminHistory();
}

// ======================================
// SELECTED MEMBER PAYMENT HISTORY
// ======================================

function showAdminHistory(){
  if(!isAdmin) return;

  const memberSelect = document.getElementById("paymentMember");
  const historyBox = document.getElementById("adminHistory");

  if(!memberSelect || !historyBox) return;

  const memberId = memberSelect.value;

  const member = members.find(m=>
    getMemberId(m) === String(memberId)
  );

  const memberPayments = payments
    .filter(p=>getPaymentMemberId(p) === String(memberId))
    .slice()
    .reverse();

  let html = `
    <h3>${member ? escapeHTML(getMemberName(member)) : "உறுப்பினர்"} - History</h3>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Month</th>
            <th>Year</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
  `;

  if(memberPayments.length === 0){
    html += `
      <tr>
        <td colspan="6">இந்த உறுப்பினருக்கு Payment History இல்லை.</td>
      </tr>
    `;
  }else{
    memberPayments.forEach(payment=>{
      const month = getPaymentMonth(payment);
      const year = getPaymentYear(payment);

      html += `
        <tr>
          <td>${escapeHTML(monthTamil(month))}</td>
          <td>${year}</td>
          <td>${formatMoney(getPaymentAmount(payment))}</td>
          <td>${escapeHTML(getPaymentDate(payment).split(" ")[0].split("T")[0])}</td>
          <td>${escapeHTML(getPaymentStatus(payment))}</td>
          <td>
            <button onclick="deletePayment('${escapeHTML(memberId)}','${escapeHTML(month)}','${year}')">
              Delete
            </button>
          </td>
        </tr>
      `;
    });
  }

  html += `
        </tbody>
      </table>
    </div>
  `;

  historyBox.innerHTML = html;
}

// ======================================

async function savePayment(){
  const memberId = document.getElementById("paymentMember").value;
  const month = document.getElementById("paymentMonth").value;
  const year = document.getElementById("paymentYear").value;
  const amount = document.getElementById("paymentAmount").value;

    return;
  }

  try{
    const result = await postAction({
      action:"savePayment",
      pin:localStorage.getItem("templeAdminPin"),
      memberId:memberId,
      month:month,
      year:year,
      amount:amount,
      paidDate:date,
      status:"PAID"
    });

    if(result.success){
      await loadData();

      renderPaymentManagementPage(memberId);

      const message = document.getElementById("paymentMessage");

      if(message){

    }else{
      document.getElementById("paymentMessage").textContent =
        result.message || "Payment சேமிக்க முடியவில்லை";

async function deletePayment(memberId,month,year){
  if(!confirm("இந்த Payment-ஐ delete செய்ய வேண்டுமா?")) return;

  try{
    const result = await postAction({
      action:"deletePayment",
      pin:localStorage.getItem("templeAdminPin"),
      memberId:memberId,
      month:month,
      year:year
    });

    if(result.success){
      await loadData();

      renderPaymentManagementPage(memberId);

    }

  }catch(error){
    alert(error.message);
  }
}

// ======================================
// API POST
// ======================================

async function postAction(payload){
  const response = await fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify(payload)
  });

  const text = await response.text();

  try{
    return JSON.parse(text);
  }catch(error){
    throw new Error(
      "Apps Script JSON பதில் கிடைக்கவில்லை. Deployment URL / access check செய்யவும்."
    );
  }
}
